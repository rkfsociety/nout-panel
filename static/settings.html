<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Настройки — Nout Panel</title>
  <link rel="stylesheet" href="/nav.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --card: #141b26;
      --border: rgba(255,255,255,.08);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --ok: #3ecf8e;
      --warn: #f0a8a8;
      --touch: 44px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .85rem; margin: 0 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      margin: 0 0 .75rem;
      font-size: .95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .field { margin-bottom: .75rem; }
    .field label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .25rem;
    }
    .field input {
      width: 100%;
      min-height: var(--touch);
      padding: .5rem .65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #080b10;
      color: var(--text);
      font-size: 1rem;
    }
    .field input:read-only { opacity: .7; }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .5rem;
    }
    .btn {
      min-height: var(--touch);
      padding: 0 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d1118;
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-primary {
      border-color: #2a5080;
      background: #152238;
      color: var(--accent);
    }
    .btn-danger {
      border-color: #5a3030;
      background: #1a1010;
      color: var(--warn);
    }
    .btn:disabled { opacity: .5; cursor: wait; }
    .status-line { font-size: .9rem; }
    .status-line.ok { color: var(--ok); }
    .status-line.err { color: var(--warn); }
    #log-box {
      margin: 0;
      padding: .65rem;
      max-height: 280px;
      overflow: auto;
      font-size: .72rem;
      line-height: 1.35;
      background: #080b10;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
    }
    #toast {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: .5rem 1rem;
      border-radius: 8px;
      background: #1a2332;
      border: 1px solid var(--border);
      font-size: .85rem;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <nav class="panel-tabs" aria-label="Разделы">
    <a href="/" class="tab">Главная</a>
    <a href="/settings" class="tab">Настройки</a>
  </nav>
  <div class="wrap">
    <h1>Настройки</h1>
    <p class="sub">Конфиг, логи и перезапуск — без консоли</p>

    <div class="card">
      <h2>Статус</h2>
      <p class="status-line" id="info-line">Загрузка…</p>
      <p class="status-line" id="agent-line"></p>
    </div>

    <div class="card">
      <h2>Параметры</h2>
      <form id="cfg-form">
        <div class="field">
          <label>Пользователь (только чтение)</label>
          <input id="f-PANEL_USER" readonly>
        </div>
        <div class="field">
          <label>Каталог панели (только чтение)</label>
          <input id="f-INSTALL_DIR" readonly>
        </div>
        <div class="field">
          <label>Порт HTTP</label>
          <input name="PANEL_PORT" id="f-PANEL_PORT" inputmode="numeric">
        </div>
        <div class="field">
          <label>Интервал метрик (сек)</label>
          <input name="PANEL_METRICS_INTERVAL" id="f-PANEL_METRICS_INTERVAL" inputmode="decimal">
        </div>
        <div class="field">
          <label>Файл логов</label>
          <input name="PANEL_LOG_FILE" id="f-PANEL_LOG_FILE">
        </div>
        <div class="field">
          <label>Ротация логов (МБ, 1–5)</label>
          <input name="PANEL_LOG_MAX_MB" id="f-PANEL_LOG_MAX_MB" inputmode="numeric">
        </div>
        <div class="field">
          <label>Архивов логов</label>
          <input name="PANEL_LOG_BACKUP_COUNT" id="f-PANEL_LOG_BACKUP_COUNT" inputmode="numeric">
        </div>
        <div class="field">
          <label>Корни файлового менеджера (:)</label>
          <input name="PANEL_FILE_ROOTS" id="f-PANEL_FILE_ROOTS">
        </div>
        <div class="field">
          <label>Папка Cursor Agent</label>
          <input name="PANEL_AGENT_WORKSPACE" id="f-PANEL_AGENT_WORKSPACE">
        </div>
        <div class="field">
          <label>Данные чата</label>
          <input name="PANEL_CHAT_DIR" id="f-PANEL_CHAT_DIR">
        </div>
        <div class="row-actions">
          <button type="submit" class="btn btn-primary">Сохранить и применить</button>
          <button type="button" class="btn" id="btn-save-only">Только сохранить</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Сервис</h2>
      <div class="row-actions">
        <button type="button" class="btn btn-danger" id="btn-restart">Перезапустить панель</button>
      </div>
    </div>

    <div class="card">
      <h2>Логи</h2>
      <pre id="log-box">Загрузка…</pre>
      <div class="row-actions" style="margin-top:.5rem">
        <button type="button" class="btn" id="btn-refresh-logs">Обновить</button>
        <label style="font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.35rem">
          <input type="checkbox" id="log-auto" checked> авто
        </label>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="/nav.js"></script>
  <script>
    const toast = document.getElementById('toast');
    function showToast(msg, isErr) {
      toast.textContent = msg;
      toast.style.display = 'block';
      toast.style.color = isErr ? '#f0a8a8' : '#3ecf8e';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function collectValues() {
      const keys = [
        'PANEL_PORT', 'PANEL_METRICS_INTERVAL', 'PANEL_LOG_FILE',
        'PANEL_LOG_MAX_MB', 'PANEL_LOG_BACKUP_COUNT', 'PANEL_FILE_ROOTS',
        'PANEL_AGENT_WORKSPACE', 'PANEL_CHAT_DIR'
      ];
      const values = {};
      keys.forEach(k => {
        const el = document.getElementById('f-' + k);
        if (el) values[k] = el.value;
      });
      return values;
    }

    async function loadInfo() {
      const r = await fetch('/api/panel/info', { cache: 'no-store' });
      const d = await r.json();
      const line = document.getElementById('info-line');
      if (!d.ok) {
        line.textContent = d.error || 'Ошибка';
        line.className = 'status-line err';
        return;
      }
      const st = d.service_active ? 'работает' : d.service_state;
      line.textContent = 'Версия ' + d.version + ' · сервис ' + st;
      line.className = 'status-line ok';
    }

    async function loadAgent() {
      const el = document.getElementById('agent-line');
      try {
        const r = await fetch('/api/chat/status', { cache: 'no-store' });
        const d = await r.json();
        if (d.available) {
          el.textContent = 'Cursor Agent: доступен';
          el.className = 'status-line ok';
        } else {
          el.textContent = 'Cursor Agent: ' + (d.hint || 'недоступен');
          el.className = 'status-line err';
        }
      } catch (_) {
        el.textContent = '';
      }
    }

    async function loadConfig() {
      const r = await fetch('/api/panel/config', { cache: 'no-store' });
      const d = await r.json();
      if (!d.ok) {
        showToast(d.error || 'Не удалось загрузить конфиг', true);
        return;
      }
      Object.entries(d.readonly || {}).forEach(([k, v]) => {
        const el = document.getElementById('f-' + k);
        if (el) el.value = v;
      });
      Object.entries(d.values || {}).forEach(([k, v]) => {
        const el = document.getElementById('f-' + k);
        if (el) el.value = v;
      });
    }

    async function saveConfig(apply) {
      const r = await fetch('/api/panel/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: collectValues(), apply: apply }),
      });
      const d = await r.json();
      if (!d.ok) {
        showToast(d.error || 'Ошибка сохранения', true);
        return false;
      }
      showToast(d.message || 'Сохранено');
      if (d.applied) {
        waitForOnline();
      }
      return true;
    }

    function waitForOnline() {
      showToast('Панель перезапускается…');
      let n = 0;
      const tick = () => {
        fetch('/api/status', { cache: 'no-store' })
          .then(r => r.json())
          .then(d => {
            if (d.ok) {
              showToast('Панель снова online');
              loadInfo();
              loadConfig();
              loadLogs();
            } else throw new Error();
          })
          .catch(() => {
            n++;
            if (n < 45) setTimeout(tick, 1000);
            else showToast('Панель не ответила', true);
          });
      };
      setTimeout(tick, 1500);
    }

    async function loadLogs() {
      const box = document.getElementById('log-box');
      try {
        const r = await fetch('/api/panel/logs?lines=250', { cache: 'no-store' });
        const d = await r.json();
        if (!d.ok) {
          box.textContent = d.error || 'Ошибка';
          return;
        }
        box.textContent = d.text || '(пусто)';
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.textContent = 'Нет связи';
      }
    }

    document.getElementById('cfg-form').addEventListener('submit', e => {
      e.preventDefault();
      saveConfig(true);
    });
    document.getElementById('btn-save-only').addEventListener('click', () => saveConfig(false));

    document.getElementById('btn-restart').addEventListener('click', async () => {
      if (!confirm('Перезапустить панель?')) return;
      const btn = document.getElementById('btn-restart');
      btn.disabled = true;
      try {
        const r = await fetch('/api/panel/restart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ confirm: 'RESTART_PANEL' }),
        });
        const d = await r.json();
        if (!d.ok) {
          showToast(d.error || 'Ошибка', true);
          btn.disabled = false;
          return;
        }
      } catch (_) {}
      waitForOnline();
      btn.disabled = false;
    });

    document.getElementById('btn-refresh-logs').addEventListener('click', loadLogs);
    setInterval(() => {
      if (document.getElementById('log-auto').checked) loadLogs();
    }, 3000);

    loadInfo();
    loadAgent();
    loadConfig();
    loadLogs();
  </script>
</body>
</html>
