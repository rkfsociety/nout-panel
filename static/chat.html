<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Чат — Nout Panel</title>
  <link rel="stylesheet" href="/page-nav.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --card: #141b26;
      --border: rgba(255,255,255,.08);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --user: #1e3a5f;
      --bot: #1a2332;
    }
    * { box-sizing: border-box; }
    body.page-chat {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 0;
      max-width: 48rem;
      margin: 0 auto;
    }
    .app-main .chat-wrap {
      padding: 0;
    }
    .chat-head {
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .chat-head h1 { margin: 0; font-size: 1.1rem; }
    .chat-head p { margin: .2rem 0 0; font-size: .8rem; color: var(--muted); }
    #chat-banner {
      padding: .6rem 1rem;
      background: rgba(240,180,41,.12);
      color: #f0b429;
      font-size: .85rem;
    }
    #chat-banner[hidden] { display: none !important; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
      min-height: 200px;
    }
    .chat-msg {
      max-width: 92%;
      padding: .65rem .85rem;
      border-radius: 14px;
      font-size: .92rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: var(--user); }
    .chat-msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .chat-msg.thinking { color: var(--muted); font-style: italic; }
    .chat-foot {
      padding: .65rem 1rem max(.65rem, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: .5rem;
      background: var(--card);
    }
    #chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: .55rem .75rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0a0e14;
      color: var(--text);
      font: inherit;
      resize: none;
    }
    #chat-send {
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #chat-send:disabled { opacity: .5; }
  </style>
</head>
<body class="page-chat">
  <div class="app-shell app-shell-chat">
    <div data-nav-mount></div>
    <main class="app-main">
  <div class="chat-wrap">
    <div class="chat-head">
      <h1>Чат с Cursor Agent</h1>
      <p id="chat-workspace">—</p>
    </div>
    <div id="chat-banner" hidden></div>
    <div id="chat-messages"></div>
    <div class="chat-foot">
      <textarea id="chat-input" rows="1" placeholder="Задача для ноута…"></textarea>
      <button type="button" id="chat-send">→</button>
    </div>
  </div>
    </main>
  </div>

  <script src="/page-nav.js"></script>
  <script src="/panel-chat.js"></script>
</body>
</html>
