<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0d12">
  <title>Главная — Nout Panel</title>
  <link rel="stylesheet" href="/panel-shell.css">
  <link rel="stylesheet" href="/page-nav.css">
  <link rel="stylesheet" href="/xterm.min.css">
  <style>
    /* Стили контента главной */
    :root {
      --card: #141b26;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --danger: #f56565;
      --warn: #f0b429;
      --touch: 44px;
    }
    * { box-sizing: border-box; }
    .wrap { max-width: 56rem; padding: 0.5rem 1rem 1.5rem; }
    .section-title {
      margin: 0 0 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    #terminal-wrap {
      height: min(360px, 55vh);
      min-height: 200px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      padding: 4px;
    }
    .btn-ctl {
      min-height: var(--touch);
      padding: 0 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d1118;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      margin: 0.2rem 0.3rem 0.2rem 0;
      touch-action: manipulation;
    }
    .btn-ctl.danger { border-color: rgba(245, 101, 101, 0.4); color: var(--danger); }
    .btn-ctl.warn { border-color: rgba(240, 180, 41, 0.4); color: var(--warn); }
    .file-toolbar { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; }
    .file-path { font-size: 0.8rem; color: var(--muted); word-break: break-all; margin-bottom: 0.35rem; }
    .file-list { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow: auto; }
    .file-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.35rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .file-list a { color: var(--accent); text-decoration: none; flex: 1; word-break: break-all; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
    .screen-preview { max-width: 100%; border-radius: 8px; margin-top: 0.5rem; }
    .grid-2 { display: grid; gap: 1rem; }
    @media (min-width: 720px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    a { color: var(--accent); }
  </style>
</head>
<body class="page-home" data-page-title="Главная">
  <div class="panel-body">
    <div class="app-shell">
      <div data-nav-mount></div>
      <main class="app-main">
        <div class="wrap">
          <h2 class="section-title">Управление</h2>

          <div class="card">
            <h2>Терминал</h2>
            <div id="terminal-wrap"></div>
            <p class="hint">Shell на ноуте</p>
            <button type="button" class="btn-ctl" id="term-new">Новая сессия</button>
          </div>

          <div class="grid-2">
            <div class="card">
              <h2>Файлы</h2>
              <div class="file-toolbar">
                <button type="button" class="btn-ctl" id="file-up">↑ Вверх</button>
                <button type="button" class="btn-ctl" id="file-refresh">Обновить</button>
                <label class="btn-ctl">Загрузить<input type="file" id="file-input" hidden></label>
              </div>
              <div class="file-path" id="file-path">—</div>
              <ul class="file-list" id="file-list"></ul>
            </div>
            <div class="card">
              <h2>Питание и экран</h2>
              <button type="button" class="btn-ctl warn" data-power="suspend" data-confirm="SUSPEND">Сон</button>
              <button type="button" class="btn-ctl danger" data-power="reboot" data-confirm="REBOOT">Перезагрузка</button>
              <button type="button" class="btn-ctl danger" data-power="shutdown" data-confirm="SHUTDOWN">Выключить</button>
              <p class="hint">Подтверждение в диалоге</p>
              <button type="button" class="btn-ctl" id="screen-shot" style="margin-top:.75rem">Скриншот</button>
              <p class="hint" id="screen-hint">—</p>
              <img id="screen-img" class="screen-preview" alt="" hidden>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/panel-shell.js"></script>
  <script src="/panel-metrics.js"></script>
  <script src="/page-nav.js"></script>
  <script src="/xterm.min.js"></script>
  <script src="/panel-remote.js"></script>
</body>
</html>
