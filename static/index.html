<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0d12">
  <title>Nout Panel</title>
  <link rel="stylesheet" href="/xterm.min.css">
  <style>
    /* Тёмная тема — комфортно ночью, без ослепляющего белого */
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --card: #141b26;
      --card-border: rgba(255, 255, 255, 0.06);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --ok: #3dd68c;
      --warn: #f0b429;
      --danger: #f56565;
      --touch: 44px;
    }
    * { box-sizing: border-box; }
    body.dash-body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .dashboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .dashboard-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: max(.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    .wrap { max-width: 56rem; margin: 0 auto; padding-top: 1rem; }
    .dashboard-chat {
      display: flex;
      flex-direction: column;
      min-height: 320px;
      max-height: 50vh;
      border-top: 1px solid var(--card-border);
      background: #0e1219;
    }
    @media (min-width: 960px) {
      .dashboard { flex-direction: row; align-items: stretch; }
      .dashboard-main {
        flex: 1;
        max-height: 100dvh;
      }
      .dashboard-chat {
        width: min(400px, 38vw);
        flex-shrink: 0;
        max-height: none;
        height: auto;
        align-self: stretch;
        border-top: none;
        border-left: 1px solid var(--card-border);
      }
    }
    .section-title {
      margin: 1.5rem 0 .75rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .control-grid {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      .control-grid { grid-template-columns: 1fr 1fr; }
      .control-span-2 { grid-column: 1 / -1; }
    }
    #terminal-wrap {
      height: min(260px, 38vh);
      min-height: 160px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      padding: 4px;
    }
    .btn-ctl {
      min-height: var(--touch);
      padding: 0 .75rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0d1118;
      color: var(--text);
      font-size: .85rem;
      cursor: pointer;
      touch-action: manipulation;
      margin: .2rem .3rem .2rem 0;
    }
    .btn-ctl.danger { border-color: rgba(245,101,101,.4); color: var(--danger); }
    .btn-ctl.warn { border-color: rgba(240,180,41,.4); color: var(--warn); }
    .file-toolbar { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
    .file-path { font-size: .75rem; color: var(--muted); word-break: break-all; margin-bottom: .35rem; }
    .file-list {
      list-style: none; padding: 0; margin: 0;
      max-height: 200px; overflow: auto;
    }
    .file-list li {
      display: flex; align-items: center; gap: .4rem;
      padding: .4rem .25rem; border-bottom: 1px solid var(--card-border);
      font-size: .85rem;
    }
    .file-list a { color: var(--accent); text-decoration: none; flex: 1; word-break: break-all; }
    .muted-li { color: var(--muted); }
    .hint { font-size: .75rem; color: var(--muted); margin: .4rem 0 0; }
    .screen-preview { max-width: 100%; border-radius: 8px; margin-top: .5rem; }
    .chat-head {
      padding: .65rem 1rem;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }
    .chat-head h2 { margin: 0; font-size: 1rem; }
    .chat-head p { margin: .15rem 0 0; font-size: .72rem; color: var(--muted); }
    #chat-banner {
      padding: .5rem 1rem;
      background: rgba(240,180,41,.12);
      color: var(--warn);
      font-size: .8rem;
      flex-shrink: 0;
    }
    #chat-banner[hidden] { display: none !important; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      min-height: 0;
    }
    .chat-msg {
      max-width: 95%;
      padding: .55rem .75rem;
      border-radius: 12px;
      font-size: .88rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: #1e3a5f; }
    .chat-msg.bot { align-self: flex-start; background: #1a2332; border: 1px solid var(--card-border); }
    .chat-msg.thinking { color: var(--muted); font-style: italic; }
    .chat-foot {
      padding: .55rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: .45rem;
      flex-shrink: 0;
      background: var(--card);
    }
    #chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 100px;
      padding: .5rem .65rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0a0e14;
      color: var(--text);
      font: inherit;
      resize: none;
    }
    #chat-send {
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #chat-send:disabled { opacity: .5; }
    .settings-grid {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      .settings-grid { grid-template-columns: 1fr 1fr; }
      .settings-span-2 { grid-column: 1 / -1; }
    }
    .field { margin-bottom: .65rem; }
    .field label {
      display: block;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: .2rem;
    }
    .field input {
      width: 100%;
      min-height: 40px;
      padding: .45rem .6rem;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: #080b10;
      color: var(--text);
      font-size: .9rem;
    }
    .field input:read-only { opacity: .65; }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .45rem;
    }
    .btn-set {
      min-height: 40px;
      padding: 0 .85rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0d1118;
      color: var(--text);
      font-size: .85rem;
      cursor: pointer;
    }
    .btn-set.primary { border-color: #2a5080; background: #152238; color: var(--accent); }
    .btn-set.danger { border-color: #5a3030; background: #1a1010; color: var(--warn); }
    .status-line { font-size: .85rem; margin: .2rem 0; }
    .status-line.ok { color: var(--ok); }
    .status-line.err { color: var(--danger); }
    #log-box {
      margin: 0;
      padding: .6rem;
      max-height: 200px;
      overflow: auto;
      font-size: .7rem;
      line-height: 1.35;
      background: #080b10;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
    }
    #toast {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      padding: .5rem 1rem;
      border-radius: 8px;
      background: #1a2332;
      border: 1px solid var(--card-border);
      font-size: .85rem;
      display: none;
      z-index: 20;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.5rem); word-break: break-word; }
    .sub { color: var(--muted); font-size: .875rem; margin: .25rem 0 1rem; line-height: 1.4; }
    .badge {
      display: inline-block;
      background: rgba(61, 214, 140, .12);
      color: var(--ok);
      padding: .2rem .55rem;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 500;
    }
    .badge.offline { background: rgba(245, 101, 101, .12); color: var(--danger); }
    .grid { display: grid; gap: .65rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
    }
    .card.metrics-compact {
      padding: .6rem .75rem;
      box-shadow: none;
    }
    .card h2 {
      margin: 0 0 .85rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .metrics-compact h2 {
      margin: 0 0 .5rem;
      font-size: .68rem;
    }
    .metrics-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .5rem;
      flex-wrap: wrap;
    }
    .metrics-time {
      font-size: .65rem;
      color: var(--muted);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .35rem .5rem;
    }
    @media (min-width: 480px) {
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      min-width: 0;
    }
    .stat-lbl {
      display: block;
      font-size: .62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .1rem;
    }
    .stat-val {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-bottom: .2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat[hidden] { display: none; }
    .bar.mini {
      height: 3px;
      background: #080b10;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar.mini .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width .35s ease;
    }
    .chart-compact {
      position: relative;
      height: 72px;
      margin: .45rem 0 .35rem;
    }
    .chart-compact-temp-wrap .chart-compact {
      height: 48px;
      margin-top: .25rem;
      margin-bottom: 0;
    }
    .chart-compact-temp[hidden],
    .chart-compact-temp-wrap[hidden] { display: none !important; }
    .temps-inline {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem .45rem;
      margin-bottom: .35rem;
      font-size: .65rem;
      color: var(--muted);
    }
    .temps-inline .t { opacity: .9; }
    .temps-inline .na { font-style: italic; opacity: .7; }
    .disks-compact { display: flex; flex-direction: column; gap: .3rem; }
    .disk-row {
      display: grid;
      grid-template-columns: 3.5rem 2.2rem 1fr;
      align-items: center;
      gap: .35rem;
      font-size: .68rem;
    }
    .disk-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .disk-pct {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .btn-copy {
      flex-shrink: 0;
      min-height: var(--touch);
      min-width: var(--touch);
      padding: 0 .75rem;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: #0d1118;
      color: var(--muted);
      font-size: .8rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-copy:active, .btn-copy.copied {
      border-color: var(--ok);
      color: var(--ok);
    }
    .bar-fill.warn { background: var(--warn); }
    .bar-fill.danger { background: var(--danger); }
    .footer {
      margin-top: 1.25rem;
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .panel-meta {
      margin-top: .35rem;
      font-size: .62rem;
      color: var(--muted);
      line-height: 1.3;
    }
    a { color: var(--accent); }
  </style>
</head>
<body class="dash-body">
  <div class="dashboard">
    <main class="dashboard-main">
  <div class="wrap">
    <h1 id="host-title">Nout Panel</h1>
    <p class="sub">Мониторинг · управление · чат</p>

    <div class="grid">
      <div class="card metrics-compact">
        <div class="metrics-head">
          <h2>Нагрузка</h2>
          <span class="badge" id="status">…</span>
          <span class="metrics-time" id="updated">—</span>
        </div>
        <div class="stat-grid">
          <div class="stat">
            <span class="stat-lbl">CPU</span>
            <span class="stat-val" id="cpu-val">—</span>
            <div class="bar mini"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
          </div>
          <div class="stat">
            <span class="stat-lbl">ОЗУ</span>
            <span class="stat-val" id="ram-val">—</span>
            <div class="bar mini"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
          </div>
          <div class="stat">
            <span class="stat-lbl">Load</span>
            <span class="stat-val" id="load-val">—</span>
            <div class="bar mini"><div class="bar-fill" id="load-bar" style="width:0%"></div></div>
          </div>
          <div class="stat" id="battery-stat" hidden>
            <span class="stat-lbl">Бат</span>
            <span class="stat-val" id="battery-val">—</span>
            <div class="bar mini"><div class="bar-fill" id="battery-bar" style="width:0%"></div></div>
          </div>
        </div>
        <div class="chart-compact">
          <canvas id="chart-load" aria-label="CPU, ОЗУ, load"></canvas>
        </div>
        <div class="chart-compact-temp-wrap" id="temp-chart-wrap" hidden>
          <div class="chart-compact">
            <canvas id="chart-temp" aria-label="Температура"></canvas>
          </div>
        </div>
        <div id="temps" class="temps-inline"></div>
        <div id="disks" class="disks-compact">…</div>
        <p class="panel-meta" id="panel-process" hidden></p>
      </div>
    </div>

    <h2 class="section-title">Управление</h2>
    <div class="control-grid">
      <div class="card control-span-2">
        <h2>Терминал</h2>
        <div id="terminal-wrap"></div>
        <p class="hint">Shell на ноуте</p>
        <button type="button" class="btn-ctl" id="term-new">Новая сессия</button>
      </div>
      <div class="card">
        <h2>Файлы</h2>
        <div class="file-toolbar">
          <button type="button" class="btn-ctl" id="file-up">↑</button>
          <button type="button" class="btn-ctl" id="file-refresh">↻</button>
          <label class="btn-ctl">Загрузить<input type="file" id="file-input" hidden></label>
        </div>
        <div class="file-path" id="file-path">—</div>
        <ul class="file-list" id="file-list"></ul>
      </div>
      <div class="card">
        <h2>Питание</h2>
        <button type="button" class="btn-ctl warn" data-power="suspend" data-confirm="SUSPEND">Сон</button>
        <button type="button" class="btn-ctl danger" data-power="reboot" data-confirm="REBOOT">Перезагрузка</button>
        <button type="button" class="btn-ctl danger" data-power="shutdown" data-confirm="SHUTDOWN">Выключить</button>
        <h2 style="margin-top:1rem">Экран</h2>
        <button type="button" class="btn-ctl" id="screen-shot">Скриншот</button>
        <p class="hint" id="screen-hint">—</p>
        <img id="screen-img" class="screen-preview" alt="" hidden>
      </div>
    </div>

    <h2 class="section-title">Настройки</h2>
    <div class="settings-grid">
      <div class="card">
        <h2>Статус</h2>
        <p class="status-line" id="info-line">—</p>
        <p class="status-line" id="agent-line"></p>
        <button type="button" class="btn-set danger" id="btn-restart">Перезапустить панель</button>
      </div>
      <div class="card">
        <h2>Логи</h2>
        <pre id="log-box">—</pre>
        <div class="row-actions">
          <button type="button" class="btn-set" id="btn-refresh-logs">Обновить</button>
          <label style="font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.3rem">
            <input type="checkbox" id="log-auto" checked> авто
          </label>
        </div>
      </div>
      <div class="card settings-span-2">
        <h2>Параметры</h2>
        <form id="cfg-form">
          <div class="settings-grid" style="margin:0">
            <div class="field">
              <label>Пользователь</label>
              <input id="f-PANEL_USER" readonly>
            </div>
            <div class="field">
              <label>Каталог панели</label>
              <input id="f-INSTALL_DIR" readonly>
            </div>
            <div class="field">
              <label>Порт HTTP</label>
              <input id="f-PANEL_PORT" inputmode="numeric">
            </div>
            <div class="field">
              <label>Интервал метрик (сек)</label>
              <input id="f-PANEL_METRICS_INTERVAL" inputmode="decimal">
            </div>
            <div class="field">
              <label>Файл логов</label>
              <input id="f-PANEL_LOG_FILE">
            </div>
            <div class="field">
              <label>Ротация (МБ)</label>
              <input id="f-PANEL_LOG_MAX_MB" inputmode="numeric">
            </div>
            <div class="field">
              <label>Архивов логов</label>
              <input id="f-PANEL_LOG_BACKUP_COUNT" inputmode="numeric">
            </div>
            <div class="field">
              <label>Корни файлов (:)</label>
              <input id="f-PANEL_FILE_ROOTS">
            </div>
            <div class="field">
              <label>Папка Agent</label>
              <input id="f-PANEL_AGENT_WORKSPACE">
            </div>
            <div class="field">
              <label>Данные чата</label>
              <input id="f-PANEL_CHAT_DIR">
            </div>
          </div>
          <div class="row-actions">
            <button type="submit" class="btn-set primary">Сохранить и применить</button>
            <button type="button" class="btn-set" id="btn-save-only">Только сохранить</button>
          </div>
        </form>
      </div>
    </div>

  </div>
    </main>

    <aside class="dashboard-chat" aria-label="Чат с Cursor Agent">
      <div class="chat-head">
        <h2>Cursor Agent</h2>
        <p id="chat-workspace">—</p>
      </div>
      <div id="chat-banner" hidden></div>
      <div id="chat-messages"></div>
      <div class="chat-foot">
        <textarea id="chat-input" rows="1" placeholder="Задача для ноута…"></textarea>
        <button type="button" id="chat-send">→</button>
      </div>
    </aside>
  </div>

  <div id="toast"></div>
  <script src="/chart.umd.min.js"></script>
  <script src="/xterm.min.js"></script>
  <script src="/panel-remote.js"></script>
  <script src="/panel-chat.js"></script>
  <script src="/panel-settings.js"></script>
  <script>
    // Экранирование для безопасной вставки в HTML
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function barClass(pct) {
      if (pct >= 90) return 'danger';
      if (pct >= 75) return 'warn';
      return '';
    }

    function setBar(id, pct) {
      const el = document.getElementById(id);
      if (!el) return;
      if (pct == null || Number.isNaN(pct)) {
        el.style.width = '0%';
        el.className = 'bar-fill';
        return;
      }
      const v = Math.min(100, Math.max(0, pct));
      el.style.width = v + '%';
      el.className = 'bar-fill ' + barClass(v);
    }

    function renderDisks(disks) {
      const root = document.getElementById('disks');
      if (!disks || !disks.length) {
        root.innerHTML = '<span class="na">Диски: —</span>';
        return;
      }
      root.innerHTML = disks.map(d => `
        <div class="disk-row" title="${esc(d.device)} · ${d.free_gb} ГБ свободно">
          <span class="disk-name">${esc(d.mount)}</span>
          <span class="disk-pct">${d.percent}%</span>
          <div class="bar mini"><div class="bar-fill ${barClass(d.percent)}" style="width:${d.percent}%"></div></div>
        </div>
      `).join('');
    }

    function renderTemps(block) {
      const root = document.getElementById('temps');
      const sensors = (block && block.available && block.sensors) ? block.sensors : [];
      if (!sensors.length) {
        root.innerHTML = '';
        return;
      }
      root.innerHTML = sensors.map(t =>
        `<span class="t">${esc(t.name)} ${esc(t.celsius)}°</span>`
      ).join('');
    }

    function formatUptime(sec) {
      if (sec == null || sec < 0) return '—';
      if (sec >= 86400) return Math.floor(sec / 86400) + ' д ' + Math.floor((sec % 86400) / 3600) + ' ч';
      if (sec >= 3600) return Math.floor(sec / 3600) + ' ч ' + Math.floor((sec % 3600) / 60) + ' м';
      if (sec >= 60) return Math.floor(sec / 60) + ' м';
      return Math.round(sec) + ' с';
    }

    function renderPanel(p) {
      const el = document.getElementById('panel-process');
      if (!p || !p.available) {
        el.hidden = true;
        return;
      }
      el.hidden = false;
      const ram = p.rss_mb != null ? p.rss_mb + ' МБ RAM' : 'RAM —';
      const thr = p.threads != null ? ' · ' + p.threads + ' поток.' : '';
      el.textContent = 'Панель: PID ' + p.pid + ' · ' + ram + thr + ' · uptime ' + formatUptime(p.uptime_sec);
    }

    function renderBattery(bat) {
      const row = document.getElementById('battery-stat');
      const val = document.getElementById('battery-val');
      if (!bat || !bat.available || bat.percent == null) {
        if (row) row.hidden = true;
        setBar('battery-bar', null);
        return;
      }
      if (row) row.hidden = false;
      val.textContent = bat.percent + '%';
      setBar('battery-bar', bat.percent);
    }

    // Chart.js — тёмные графики истории
    const chartColors = {
      cpu: '#4da3ff',
      ram: '#3dd68c',
      load: '#f0b429',
      temp: '#f56565',
      grid: 'rgba(255,255,255,0.06)',
      text: '#7d8fa8',
    };

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
      },
      scales: {
        x: {
          ticks: { color: chartColors.text, maxTicksLimit: 6, maxRotation: 0 },
          grid: { color: chartColors.grid },
        },
        y: {
          min: 0,
          max: 100,
          ticks: { color: chartColors.text },
          grid: { color: chartColors.grid },
        },
      },
    };

    let chartLoad = null;
    let chartTemp = null;

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function initCharts() {
      if (typeof Chart === 'undefined') return;
      const ctxLoad = document.getElementById('chart-load');
      const ctxTemp = document.getElementById('chart-temp');

      chartLoad = new Chart(ctxLoad, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'CPU %', data: [], borderColor: chartColors.cpu, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'ОЗУ %', data: [], borderColor: chartColors.ram, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'Load %', data: [], borderColor: chartColors.load, tension: 0.2, pointRadius: 0, borderWidth: 2 },
          ],
        },
        options: chartDefaults,
      });

      chartTemp = new Chart(ctxTemp, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: '°C', data: [], borderColor: chartColors.temp, tension: 0.2, pointRadius: 0, borderWidth: 2, fill: false },
          ],
        },
        options: {
          ...chartDefaults,
          scales: {
            x: chartDefaults.scales.x,
            y: {
              min: 0,
              ticks: { color: chartColors.text },
              grid: { color: chartColors.grid },
            },
          },
        },
      });
    }

    function updateCharts(history) {
      if (!chartLoad || !history || !history.length) return;
      const labels = history.map(p => formatTime(p.ts));
      chartLoad.data.labels = labels;
      chartLoad.data.datasets[0].data = history.map(p => p.cpu);
      chartLoad.data.datasets[1].data = history.map(p => p.ram);
      chartLoad.data.datasets[2].data = history.map(p => p.load);
      chartLoad.update('none');

      const hasTemp = history.some(p => p.temp_max != null);
      const tempWrap = document.getElementById('temp-chart-wrap');
      if (tempWrap) tempWrap.hidden = !hasTemp;
      if (hasTemp && chartTemp) {
        chartTemp.data.labels = labels;
        chartTemp.data.datasets[0].data = history.map(p => p.temp_max ?? null);
        chartTemp.update('none');
      }
    }

    let hostname = 'Nout Panel';

    async function loadHost() {
      try {
        const r = await fetch('/api/status', { cache: 'no-store' });
        const d = await r.json();
        if (d.hostname) {
          hostname = d.hostname;
          document.getElementById('host-title').textContent = hostname;
          document.title = hostname + ' — Nout Panel';
        }
      } catch (_) { /* повторим на следующем тике */ }
    }

    async function tick() {
      try {
        const r = await fetch('/api/metrics', { cache: 'no-store' });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'API error');

        document.getElementById('status').textContent = hostname;
        document.getElementById('status').className = 'badge';

        const cpu = d.cpu_percent ?? 0;
        const mem = d.memory || {};
        const ld = d.load || {};
        const ram = mem.ram_percent;
        const loadPct = ld.load_percent;

        document.getElementById('cpu-val').textContent = cpu + '%';
        if (mem.available === false || ram == null) {
          document.getElementById('ram-val').textContent = '—';
          setBar('ram-bar', null);
        } else {
          document.getElementById('ram-val').textContent = ram + '%';
          setBar('ram-bar', ram);
        }
        if (ld.load_1 == null || loadPct == null) {
          document.getElementById('load-val').textContent = '—';
          setBar('load-bar', null);
        } else {
          document.getElementById('load-val').textContent = loadPct + '%';
          setBar('load-bar', Math.min(100, loadPct));
        }

        setBar('cpu-bar', cpu);
        renderDisks(d.disks);
        renderTemps(d.temperatures);
        renderBattery(d.battery);
        renderPanel(d.panel);
        updateCharts(d.history);

        const t = new Date(d.time_utc);
        document.getElementById('updated').textContent = t.toLocaleTimeString('ru-RU', {
          hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
      } catch (e) {
        document.getElementById('status').textContent = 'Нет связи';
        document.getElementById('status').className = 'badge offline';
      }
    }

    initCharts();
    loadHost();
    tick();
    setInterval(tick, 1000);
    setInterval(loadHost, 30000);
  </script>
</body>
</html>
