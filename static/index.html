<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0d12">
  <title>Nout Panel</title>
  <link rel="stylesheet" href="/page-nav.css">
  <style>
    /* Тёмная тема — компактный мониторинг */
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --card: #141b26;
      --card-border: rgba(255, 255, 255, 0.06);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --ok: #3dd68c;
      --warn: #f0b429;
      --danger: #f56565;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: .75rem 1rem 2rem;
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.5rem); word-break: break-word; }
    .sub { color: var(--muted); font-size: .875rem; margin: .25rem 0 1rem; line-height: 1.4; }
    .badge {
      display: inline-block;
      background: rgba(61, 214, 140, .12);
      color: var(--ok);
      padding: .2rem .55rem;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 500;
    }
    .badge.offline { background: rgba(245, 101, 101, .12); color: var(--danger); }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: .6rem .75rem;
    }
    .card h2 {
      margin: 0 0 .5rem;
      font-size: .68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .metrics-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .5rem;
      flex-wrap: wrap;
    }
    .metrics-time { font-size: .65rem; color: var(--muted); }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .35rem .5rem;
    }
    @media (min-width: 480px) {
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .stat { min-width: 0; }
    .stat-lbl {
      display: block;
      font-size: .62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .1rem;
    }
    .stat-val {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-bottom: .2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat[hidden] { display: none; }
    .bar.mini {
      height: 3px;
      background: #080b10;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar.mini .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width .35s ease;
    }
    .bar-fill.warn { background: var(--warn); }
    .bar-fill.danger { background: var(--danger); }
    .chart-compact {
      position: relative;
      height: 72px;
      margin: .45rem 0 .35rem;
    }
    .chart-compact-temp-wrap .chart-compact {
      height: 48px;
      margin-top: .25rem;
      margin-bottom: 0;
    }
    .chart-compact-temp-wrap[hidden] { display: none !important; }
    .temps-inline {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem .45rem;
      margin-bottom: .35rem;
      font-size: .65rem;
      color: var(--muted);
    }
    .disks-compact { display: flex; flex-direction: column; gap: .3rem; }
    .disk-row {
      display: grid;
      grid-template-columns: 3.5rem 2.2rem 1fr;
      align-items: center;
      gap: .35rem;
      font-size: .68rem;
    }
    .disk-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .disk-pct {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .panel-meta {
      margin-top: .35rem;
      font-size: .62rem;
      color: var(--muted);
      line-height: 1.3;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <nav class="page-nav" aria-label="Разделы">
    <a href="/" data-page>Мониторинг</a>
    <a href="/remote" data-page>Управление</a>
    <a href="/chat" data-page>Чат</a>
    <a href="/settings" data-page>Настройки</a>
  </nav>
  <div class="wrap">
    <h1 id="host-title">Nout Panel</h1>
    <p class="sub">Нагрузка, диски, температура · обновление ~1 с</p>

    <div class="card metrics-compact">
      <div class="metrics-head">
        <h2>Нагрузка</h2>
        <span class="badge" id="status">…</span>
        <span class="metrics-time" id="updated">—</span>
      </div>
      <div class="stat-grid">
        <div class="stat">
          <span class="stat-lbl">CPU</span>
          <span class="stat-val" id="cpu-val">—</span>
          <div class="bar mini"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
        </div>
        <div class="stat">
          <span class="stat-lbl">ОЗУ</span>
          <span class="stat-val" id="ram-val">—</span>
          <div class="bar mini"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
        </div>
        <div class="stat">
          <span class="stat-lbl">Load</span>
          <span class="stat-val" id="load-val">—</span>
          <div class="bar mini"><div class="bar-fill" id="load-bar" style="width:0%"></div></div>
        </div>
        <div class="stat" id="battery-stat" hidden>
          <span class="stat-lbl">Бат</span>
          <span class="stat-val" id="battery-val">—</span>
          <div class="bar mini"><div class="bar-fill" id="battery-bar" style="width:0%"></div></div>
        </div>
      </div>
      <div class="chart-compact">
        <canvas id="chart-load" aria-label="CPU, ОЗУ, load"></canvas>
      </div>
      <div class="chart-compact-temp-wrap" id="temp-chart-wrap" hidden>
        <div class="chart-compact">
          <canvas id="chart-temp" aria-label="Температура"></canvas>
        </div>
      </div>
      <div id="temps" class="temps-inline"></div>
      <div id="disks" class="disks-compact">…</div>
      <p class="panel-meta" id="panel-process" hidden></p>
    </div>
  </div>

  <script src="/page-nav.js"></script>
  <script src="/chart.umd.min.js"></script>
  <script>
    // Экранирование для безопасной вставки в HTML
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function barClass(pct) {
      if (pct >= 90) return 'danger';
      if (pct >= 75) return 'warn';
      return '';
    }

    function setBar(id, pct) {
      const el = document.getElementById(id);
      if (!el) return;
      if (pct == null || Number.isNaN(pct)) {
        el.style.width = '0%';
        el.className = 'bar-fill';
        return;
      }
      const v = Math.min(100, Math.max(0, pct));
      el.style.width = v + '%';
      el.className = 'bar-fill ' + barClass(v);
    }

    function renderDisks(disks) {
      const root = document.getElementById('disks');
      if (!disks || !disks.length) {
        root.innerHTML = '<span class="na">Диски: —</span>';
        return;
      }
      root.innerHTML = disks.map(d => `
        <div class="disk-row" title="${esc(d.device)} · ${d.free_gb} ГБ свободно">
          <span class="disk-name">${esc(d.mount)}</span>
          <span class="disk-pct">${d.percent}%</span>
          <div class="bar mini"><div class="bar-fill ${barClass(d.percent)}" style="width:${d.percent}%"></div></div>
        </div>
      `).join('');
    }

    function renderTemps(block) {
      const root = document.getElementById('temps');
      const sensors = (block && block.available && block.sensors) ? block.sensors : [];
      if (!sensors.length) {
        root.innerHTML = '';
        return;
      }
      root.innerHTML = sensors.map(t =>
        `<span class="t">${esc(t.name)} ${esc(t.celsius)}°</span>`
      ).join('');
    }

    function formatUptime(sec) {
      if (sec == null || sec < 0) return '—';
      if (sec >= 86400) return Math.floor(sec / 86400) + ' д ' + Math.floor((sec % 86400) / 3600) + ' ч';
      if (sec >= 3600) return Math.floor(sec / 3600) + ' ч ' + Math.floor((sec % 3600) / 60) + ' м';
      if (sec >= 60) return Math.floor(sec / 60) + ' м';
      return Math.round(sec) + ' с';
    }

    function renderPanel(p) {
      const el = document.getElementById('panel-process');
      if (!p || !p.available) {
        el.hidden = true;
        return;
      }
      el.hidden = false;
      const ram = p.rss_mb != null ? p.rss_mb + ' МБ RAM' : 'RAM —';
      const thr = p.threads != null ? ' · ' + p.threads + ' поток.' : '';
      el.textContent = 'Панель: PID ' + p.pid + ' · ' + ram + thr + ' · uptime ' + formatUptime(p.uptime_sec);
    }

    function renderBattery(bat) {
      const row = document.getElementById('battery-stat');
      const val = document.getElementById('battery-val');
      if (!bat || !bat.available || bat.percent == null) {
        if (row) row.hidden = true;
        setBar('battery-bar', null);
        return;
      }
      if (row) row.hidden = false;
      val.textContent = bat.percent + '%';
      setBar('battery-bar', bat.percent);
    }

    const chartColors = {
      cpu: '#4da3ff',
      ram: '#3dd68c',
      load: '#f0b429',
      temp: '#f56565',
      grid: 'rgba(255,255,255,0.06)',
      text: '#7d8fa8',
    };

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: chartColors.text, maxTicksLimit: 6, maxRotation: 0 },
          grid: { color: chartColors.grid },
        },
        y: {
          min: 0,
          max: 100,
          ticks: { color: chartColors.text },
          grid: { color: chartColors.grid },
        },
      },
    };

    let chartLoad = null;
    let chartTemp = null;

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function initCharts() {
      if (typeof Chart === 'undefined') return;
      chartLoad = new Chart(document.getElementById('chart-load'), {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'CPU %', data: [], borderColor: chartColors.cpu, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'ОЗУ %', data: [], borderColor: chartColors.ram, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'Load %', data: [], borderColor: chartColors.load, tension: 0.2, pointRadius: 0, borderWidth: 2 },
          ],
        },
        options: chartDefaults,
      });
      chartTemp = new Chart(document.getElementById('chart-temp'), {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: '°C', data: [], borderColor: chartColors.temp, tension: 0.2, pointRadius: 0, borderWidth: 2, fill: false },
          ],
        },
        options: {
          ...chartDefaults,
          scales: {
            x: chartDefaults.scales.x,
            y: { min: 0, ticks: { color: chartColors.text }, grid: { color: chartColors.grid } },
          },
        },
      });
    }

    function updateCharts(history) {
      if (!chartLoad || !history || !history.length) return;
      const labels = history.map(p => formatTime(p.ts));
      chartLoad.data.labels = labels;
      chartLoad.data.datasets[0].data = history.map(p => p.cpu);
      chartLoad.data.datasets[1].data = history.map(p => p.ram);
      chartLoad.data.datasets[2].data = history.map(p => p.load);
      chartLoad.update('none');

      const hasTemp = history.some(p => p.temp_max != null);
      const tempWrap = document.getElementById('temp-chart-wrap');
      if (tempWrap) tempWrap.hidden = !hasTemp;
      if (hasTemp && chartTemp) {
        chartTemp.data.labels = labels;
        chartTemp.data.datasets[0].data = history.map(p => p.temp_max ?? null);
        chartTemp.update('none');
      }
    }

    let hostname = 'Nout Panel';

    async function loadHost() {
      try {
        const r = await fetch('/api/status', { cache: 'no-store' });
        const d = await r.json();
        if (d.hostname) {
          hostname = d.hostname;
          document.getElementById('host-title').textContent = hostname;
          document.title = hostname + ' — Nout Panel';
        }
      } catch (_) { /* повторим на следующем тике */ }
    }

    async function tick() {
      try {
        const r = await fetch('/api/metrics', { cache: 'no-store' });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'API error');

        document.getElementById('status').textContent = hostname;
        document.getElementById('status').className = 'badge';

        const cpu = d.cpu_percent ?? 0;
        const mem = d.memory || {};
        const ld = d.load || {};
        const ram = mem.ram_percent;
        const loadPct = ld.load_percent;

        document.getElementById('cpu-val').textContent = cpu + '%';
        if (mem.available === false || ram == null) {
          document.getElementById('ram-val').textContent = '—';
          setBar('ram-bar', null);
        } else {
          document.getElementById('ram-val').textContent = ram + '%';
          setBar('ram-bar', ram);
        }
        if (ld.load_1 == null || loadPct == null) {
          document.getElementById('load-val').textContent = '—';
          setBar('load-bar', null);
        } else {
          document.getElementById('load-val').textContent = loadPct + '%';
          setBar('load-bar', Math.min(100, loadPct));
        }

        setBar('cpu-bar', cpu);
        renderDisks(d.disks);
        renderTemps(d.temperatures);
        renderBattery(d.battery);
        renderPanel(d.panel);
        updateCharts(d.history);

        const t = new Date(d.time_utc);
        document.getElementById('updated').textContent = t.toLocaleTimeString('ru-RU', {
          hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
      } catch (e) {
        document.getElementById('status').textContent = 'Нет связи';
        document.getElementById('status').className = 'badge offline';
      }
    }

    initCharts();
    loadHost();
    tick();
    setInterval(tick, 1000);
    setInterval(loadHost, 30000);
  </script>
</body>
</html>
