<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0d12">
  <title>Nout Panel</title>
  <link rel="stylesheet" href="/nav.css">
  <style>
    /* Тёмная тема — комфортно ночью, без ослепляющего белого */
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --card: #141b26;
      --card-border: rgba(255, 255, 255, 0.06);
      --accent: #4da3ff;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --ok: #3dd68c;
      --warn: #f0b429;
      --danger: #f56565;
      --touch: 44px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0 max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 52rem; margin: 0 auto; padding-top: 1rem; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.5rem); word-break: break-word; }
    .sub { color: var(--muted); font-size: .875rem; margin: .25rem 0 1rem; line-height: 1.4; }
    .badge {
      display: inline-block;
      background: rgba(61, 214, 140, .12);
      color: var(--ok);
      padding: .4rem .85rem;
      border-radius: 999px;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
    .badge.offline { background: rgba(245, 101, 101, .12); color: var(--danger); }
    .grid { display: grid; gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem 1.15rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
    }
    @media (min-width: 640px) {
      .card { padding: 1.25rem 1.5rem; }
    }
    .card h2 {
      margin: 0 0 .85rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .btn-copy {
      flex-shrink: 0;
      min-height: var(--touch);
      min-width: var(--touch);
      padding: 0 .75rem;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: #0d1118;
      color: var(--muted);
      font-size: .8rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-copy:active, .btn-copy.copied {
      border-color: var(--ok);
      color: var(--ok);
    }
    .chart-box {
      position: relative;
      height: min(220px, 42vw);
      min-height: 160px;
      margin-bottom: .75rem;
    }
    .chart-box:last-child { margin-bottom: 0; }
    .chart-legend {
      font-size: .75rem;
      color: var(--muted);
      margin-top: .35rem;
    }
    .metric { margin-bottom: 1rem; }
    .metric:last-child { margin-bottom: 0; }
    .metric-head {
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      font-size: .9rem;
      margin-bottom: .35rem;
    }
    .bar {
      height: 8px;
      background: #080b10;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width .35s ease;
    }
    .bar-fill.warn { background: var(--warn); }
    .bar-fill.danger { background: var(--danger); }
    .disk {
      border-top: 1px solid var(--card-border);
      padding-top: .85rem;
      margin-top: .85rem;
    }
    .disk:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .disk-title { font-weight: 600; font-size: .95rem; }
    .disk-meta { font-size: .8rem; color: var(--muted); margin: .2rem 0 .5rem; word-break: break-word; }
    .temps { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .temp-chip {
      font-size: .8rem;
      background: #080b10;
      padding: .35rem .55rem;
      border-radius: 8px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }
    .temp-chip.na { font-style: italic; opacity: .85; }
    .footer {
      margin-top: 1.25rem;
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .panel-meta {
      margin-top: .75rem;
      font-size: .72rem;
      color: var(--muted);
      line-height: 1.4;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <nav class="panel-tabs" aria-label="Разделы">
    <a href="/" class="tab">Мониторинг</a>
    <a href="/chat" class="tab">Чат</a>
    <a href="/remote" class="tab">Управление</a>
    <a href="/settings" class="tab">Настройки</a>
  </nav>
  <div class="wrap">
    <h1 id="host-title">Nout Panel</h1>
    <p class="sub">Тёмная панель · обновление каждую секунду · графики ~10 мин</p>
    <div class="badge" id="status">Подключение…</div>

    <div class="grid">
      <div class="card">
        <h2>История</h2>
        <div class="chart-box">
          <canvas id="chart-load" aria-label="График CPU, ОЗУ и load"></canvas>
        </div>
        <p class="chart-legend">CPU · ОЗУ · Load (% от числа ядер)</p>
        <div class="chart-box">
          <canvas id="chart-temp" aria-label="График температуры"></canvas>
        </div>
        <p class="chart-legend" id="temp-legend">Температура (макс. по датчикам)</p>
      </div>

      <div class="card">
        <h2>Сейчас</h2>
        <div class="metric">
          <div class="metric-head">
            <span>CPU</span>
            <span id="cpu-val">—</span>
          </div>
          <div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-head">
            <span>ОЗУ</span>
            <span id="ram-val">—</span>
          </div>
          <div class="bar"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-head">
            <span>Load (1 мин)</span>
            <span id="load-val">—</span>
          </div>
          <div class="bar"><div class="bar-fill" id="load-bar" style="width:0%"></div></div>
        </div>
        <div class="metric" id="battery-metric">
          <div class="metric-head">
            <span>Батарея</span>
            <span id="battery-val">—</span>
          </div>
          <div class="bar"><div class="bar-fill" id="battery-bar" style="width:0%"></div></div>
        </div>
        <div id="temps" class="temps"></div>
        <p class="panel-meta" id="panel-process" hidden></p>
      </div>

      <div class="card">
        <h2>Диски</h2>
        <div id="disks">Загрузка…</div>
      </div>
    </div>

    <p class="footer">
      <span id="updated">—</span>
    </p>
  </div>

  <script src="/nav.js"></script>
  <script src="/chart.umd.min.js"></script>
  <script>
    // Экранирование для безопасной вставки в HTML
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function barClass(pct) {
      if (pct >= 90) return 'danger';
      if (pct >= 75) return 'warn';
      return '';
    }

    function setBar(id, pct) {
      const el = document.getElementById(id);
      if (pct == null || Number.isNaN(pct)) {
        el.style.width = '0%';
        el.className = 'bar-fill';
        return;
      }
      const v = Math.min(100, Math.max(0, pct));
      el.style.width = v + '%';
      el.className = 'bar-fill ' + barClass(v);
    }

    // Копирование в буфер (телефон / десктоп)
    async function copyText(text, btn) {
      const label = btn.dataset.label || btn.textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.classList.add('copied');
      btn.textContent = 'Скопировано';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = label;
      }, 1600);
    }

    function bindCopyButtons() {
      document.querySelectorAll('.btn-copy[data-copy]').forEach(btn => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = '1';
        btn.dataset.label = btn.textContent;
        btn.addEventListener('click', () => copyText(btn.dataset.copy, btn));
      });
    }

    function renderDisks(disks) {
      const root = document.getElementById('disks');
      if (!disks || !disks.length) {
        root.textContent = 'Нет данных о дисках';
        return;
      }
      root.innerHTML = disks.map(d => `
        <div class="disk">
          <div class="disk-title">${esc(d.mount)}</div>
          <div class="disk-meta">${esc(d.device)} · ${esc(d.fstype)} · свободно ${d.free_gb} ГБ из ${d.total_gb} ГБ</div>
          <div class="metric-head"><span>Занято</span><span>${d.percent}%</span></div>
          <div class="bar"><div class="bar-fill ${barClass(d.percent)}" style="width:${d.percent}%"></div></div>
        </div>
      `).join('');
    }

    function renderTemps(block) {
      const root = document.getElementById('temps');
      const sensors = (block && block.available && block.sensors) ? block.sensors : [];
      if (!sensors.length) {
        root.innerHTML = '<span class="temp-chip na">Температура: N/A</span>';
        return;
      }
      root.innerHTML = sensors.map(t => {
        const c = t.celsius != null ? t.celsius + '°C' : 'N/A';
        const label = t.name + ': ' + c;
        return `<span class="temp-chip"><span>${esc(t.name)}: ${esc(c)}</span>
          <button type="button" class="btn-copy" data-copy="${esc(label)}" style="min-height:32px;min-width:auto;padding:0 .5rem" aria-label="Копировать">⎘</button></span>`;
      }).join('');
      bindCopyButtons();
    }

    function formatUptime(sec) {
      if (sec == null || sec < 0) return '—';
      if (sec >= 86400) return Math.floor(sec / 86400) + ' д ' + Math.floor((sec % 86400) / 3600) + ' ч';
      if (sec >= 3600) return Math.floor(sec / 3600) + ' ч ' + Math.floor((sec % 3600) / 60) + ' м';
      if (sec >= 60) return Math.floor(sec / 60) + ' м';
      return Math.round(sec) + ' с';
    }

    function renderPanel(p) {
      const el = document.getElementById('panel-process');
      if (!p || !p.available) {
        el.hidden = true;
        return;
      }
      el.hidden = false;
      const ram = p.rss_mb != null ? p.rss_mb + ' МБ RAM' : 'RAM —';
      const thr = p.threads != null ? ' · ' + p.threads + ' поток.' : '';
      el.textContent = 'Панель: PID ' + p.pid + ' · ' + ram + thr + ' · uptime ' + formatUptime(p.uptime_sec);
    }

    function renderBattery(bat) {
      const val = document.getElementById('battery-val');
      if (!bat || !bat.available || bat.percent == null) {
        val.textContent = 'N/A';
        setBar('battery-bar', null);
        return;
      }
      val.textContent = bat.percent + '% · ' + (bat.status_label || bat.status || '');
      setBar('battery-bar', bat.percent);
    }

    // Chart.js — тёмные графики истории
    const chartColors = {
      cpu: '#4da3ff',
      ram: '#3dd68c',
      load: '#f0b429',
      temp: '#f56565',
      grid: 'rgba(255,255,255,0.06)',
      text: '#7d8fa8',
    };

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: chartColors.text, boxWidth: 12, font: { size: 11 } },
        },
      },
      scales: {
        x: {
          ticks: { color: chartColors.text, maxTicksLimit: 6, maxRotation: 0 },
          grid: { color: chartColors.grid },
        },
        y: {
          min: 0,
          max: 100,
          ticks: { color: chartColors.text },
          grid: { color: chartColors.grid },
        },
      },
    };

    let chartLoad = null;
    let chartTemp = null;

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function initCharts() {
      if (typeof Chart === 'undefined') return;
      const ctxLoad = document.getElementById('chart-load');
      const ctxTemp = document.getElementById('chart-temp');

      chartLoad = new Chart(ctxLoad, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'CPU %', data: [], borderColor: chartColors.cpu, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'ОЗУ %', data: [], borderColor: chartColors.ram, tension: 0.2, pointRadius: 0, borderWidth: 2 },
            { label: 'Load %', data: [], borderColor: chartColors.load, tension: 0.2, pointRadius: 0, borderWidth: 2 },
          ],
        },
        options: chartDefaults,
      });

      chartTemp = new Chart(ctxTemp, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: '°C', data: [], borderColor: chartColors.temp, tension: 0.2, pointRadius: 0, borderWidth: 2, fill: false },
          ],
        },
        options: {
          ...chartDefaults,
          scales: {
            x: chartDefaults.scales.x,
            y: {
              min: 0,
              ticks: { color: chartColors.text },
              grid: { color: chartColors.grid },
            },
          },
        },
      });
    }

    function updateCharts(history) {
      if (!chartLoad || !history || !history.length) return;
      const labels = history.map(p => formatTime(p.ts));
      chartLoad.data.labels = labels;
      chartLoad.data.datasets[0].data = history.map(p => p.cpu);
      chartLoad.data.datasets[1].data = history.map(p => p.ram);
      chartLoad.data.datasets[2].data = history.map(p => p.load);
      chartLoad.update('none');

      const hasTemp = history.some(p => p.temp_max != null);
      document.getElementById('chart-temp').parentElement.hidden = !hasTemp;
      document.getElementById('temp-legend').hidden = !hasTemp;
      if (hasTemp && chartTemp) {
        chartTemp.data.labels = labels;
        chartTemp.data.datasets[0].data = history.map(p => p.temp_max ?? null);
        chartTemp.update('none');
      }
    }

    let hostname = 'Nout Panel';

    async function loadHost() {
      try {
        const r = await fetch('/api/status', { cache: 'no-store' });
        const d = await r.json();
        if (d.hostname) {
          hostname = d.hostname;
          document.getElementById('host-title').textContent = hostname;
          document.title = hostname + ' — Nout Panel';
        }
      } catch (_) { /* повторим на следующем тике */ }
    }

    async function tick() {
      try {
        const r = await fetch('/api/metrics', { cache: 'no-store' });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'API error');

        document.getElementById('status').textContent = 'Онлайн · ' + hostname;
        document.getElementById('status').className = 'badge';

        const cpu = d.cpu_percent ?? 0;
        const mem = d.memory || {};
        const ld = d.load || {};
        const ram = mem.ram_percent;
        const loadPct = ld.load_percent;

        document.getElementById('cpu-val').textContent = cpu + '%';
        if (mem.available === false || ram == null) {
          document.getElementById('ram-val').textContent = 'N/A';
          setBar('ram-bar', null);
        } else {
          document.getElementById('ram-val').textContent =
            mem.ram_used_gb + ' / ' + mem.ram_total_gb + ' ГБ (' + ram + '%)';
          setBar('ram-bar', ram);
        }
        if (ld.load_1 == null || loadPct == null) {
          document.getElementById('load-val').textContent = 'N/A';
          setBar('load-bar', null);
        } else {
          document.getElementById('load-val').textContent =
            ld.load_1 + ' · ' + ld.cpu_cores + ' ядер (' + loadPct + '%)';
          setBar('load-bar', Math.min(100, loadPct));
        }

        setBar('cpu-bar', cpu);
        renderDisks(d.disks);
        renderTemps(d.temperatures);
        renderBattery(d.battery);
        renderPanel(d.panel);
        updateCharts(d.history);

        const t = new Date(d.time_utc);
        document.getElementById('updated').textContent =
          'Обновлено ' + t.toLocaleTimeString('ru-RU');
      } catch (e) {
        document.getElementById('status').textContent = 'Нет связи';
        document.getElementById('status').className = 'badge offline';
      }
    }

    initCharts();
    loadHost();
    tick();
    setInterval(tick, 1000);
    setInterval(loadHost, 30000);
  </script>
</body>
</html>
